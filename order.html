<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка – Rick Owens Shop</title>
    
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Собственные стили -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- ================= НАВИГАЦИЯ ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Rick Owens Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Переключить навигацию">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="order.html">Заявка</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ================= ОСНОВНОЙ КОНТЕНТ ================= -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h1 class="h4 mb-0">Форма заявки</h1>
                    </div>
                    <div class="card-body p-4">
                        <div class="alert alert-info" role="alert">
                            Заполните форму. Поля со звёздочкой (*) являются обязательными.
                        </div>
                        
                        <form>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="order-name" class="form-label fw-bold">Имя *</label>
                                    <input id="order-name" name="name" type="text" class="form-control" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="order-email" class="form-label fw-bold">E-mail *</label>
                                    <input id="order-email" name="email" type="email" class="form-control" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="order-phone" class="form-label fw-bold">Телефон</label>
                                    <div class="input-group">
                                        <span class="input-group-text">+7</span>
                                        <input id="order-phone" name="phone" type="tel" class="form-control" placeholder="900 000-00-00">
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="order-product" class="form-label fw-bold">Товар</label>
                                    <select id="order-product" name="product" class="form-select">
                                        <option selected>Выберите товар</option>
                                        <option value="converse">Кеды x Converse</option>
                                        <option value="black-low">Кеды Black Low</option>
                                        <option value="jumbo">JUMBOLACE SNEAKS</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label for="order-comment" class="form-label fw-bold">Комментарий</label>
                                    <textarea id="order-comment" name="comment" class="form-control" rows="4" placeholder="Укажите размер или дополнительные пожелания"></textarea>
                                </div>
                                <div class="col-12">
                                    <div class="form-check">
                                        <input id="order-agree" class="form-check-input" type="checkbox" required>
                                        <label class="form-check-label" for="order-agree">
                                            Я согласен на обработку данных *
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12 d-flex gap-2 mt-4">
                                    <button class="btn btn-dark px-4" type="submit">Отправить заявку</button>
                                    <button class="btn btn-outline-secondary" type="reset">Очистить</button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ================= ПОДВАЛ ================= -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Rick Owens Shop. Учебный проект.</p>
        </div>
    </footer>

    <!-- Подключение Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
